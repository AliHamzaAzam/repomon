[package]
name = "repomon-desktop"
version.workspace = true
description = "Repomon mission control desktop app"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repomon_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
tauri = { version = "~2.9.0", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "~2.4.0"
tauri-plugin-notification = "~2.3.0"
tauri-plugin-process = "~2.3.0"
tauri-plugin-updater = "~2.9.0"
repomon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri-plugin-opener = "=2.5.0"

# The GUI's "install the command line" action puts its directory on the *user* PATH, which lives
# in HKCU\Environment, and tells running processes about it with WM_SETTINGCHANGE. Both crates are
# already in the workspace lock at these versions (winreg via portable-pty, windows-sys via
# repomon-core), so this adds an edge rather than a new dependency.
[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
