[package]
name = "repomon-desktop"
version.workspace = true
description = "Repomon mission control desktop app"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# Keep the library name distinct from the binary to avoid Windows linker collisions
# (rust-lang/cargo#8519).
name = "repomon_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
tauri = { version = "~2.9.0", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "~2.4.0"
tauri-plugin-notification = "~2.3.0"
tauri-plugin-process = "~2.3.0"
tauri-plugin-updater = "~2.9.0"
repomon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri-plugin-opener = "=2.5.0"

# User PATH installation needs HKCU environment writes and WM_SETTINGCHANGE notifications.
[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
