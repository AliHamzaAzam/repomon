name: desktop release

# Manual dispatch keeps release builds available while automatic signing remains unconfigured.
on:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Complete Windows smoke checks before publishing artifacts.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Prepare sidecars
        working-directory: apps/desktop
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
          CI: "true"
        run: bun run sidecar:prepare
      - name: Prepare updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: >-
          jq --arg key "$TAURI_SIGNING_PUBLIC_KEY"
          '.plugins.updater.pubkey = $key'
          apps/desktop/src-tauri/tauri.release.win.conf.json
          > apps/desktop/src-tauri/tauri.signed.conf.json
      - name: Build Windows installer without publishing
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.signed.conf.json
      - name: Windows smoke test
        timeout-minutes: 5
        shell: pwsh
        run: .github/scripts/windows-smoke.ps1 -Triple "x86_64-pc-windows-msvc"

  desktop:
    needs: windows-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            config: apps/desktop/src-tauri/tauri.release.conf.json
          - platform: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
            config: apps/desktop/src-tauri/tauri.release.conf.json
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            config: apps/desktop/src-tauri/tauri.release.conf.json
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            config: apps/desktop/src-tauri/tauri.release.win.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          librsvg2-dev
          libayatana-appindicator3-dev
          patchelf
          rpm
          tmux
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Prepare updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: >-
          jq --arg key "$TAURI_SIGNING_PUBLIC_KEY"
          '.plugins.updater.pubkey = $key'
          "${{ matrix.config }}"
          > apps/desktop/src-tauri/tauri.signed.conf.json
      - name: Prepare sidecars
        working-directory: apps/desktop
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          CI: "true"
        run: bun run sidecar:prepare
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Repomon ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | Platform | Download and install |
            |---|---|
            | macOS | Download the DMG for your Mac. The preview channel provides a universal build for Apple silicon and Intel; a versioned release may provide separate builds. Open the DMG and drag Repomon to Applications. |
            | Windows | Download the x64 setup EXE and run the installer. No WSL or separate Visual C++ runtime is required. |
            | Linux | Download an AppImage, deb or rpm. Make the AppImage executable, or install the package with your distribution's package manager. |

            ## Included and required tools

            The app bundles the daemon (`repomond`), the CLI/TUI (`repomon`), portable tmux on macOS and Linux, and the ConPTY agent host on Windows. No existing Repomon installation or separate tmux install is required for the desktop app.

            Install Git and at least one agent CLI, such as Claude Code or Codex, and sign in to that agent. The setup wizard checks these prerequisites. To use the bundled CLI from a terminal, choose Settings > System > Command-line tools > Install.

            ## Preview channel and updates

            [desktop-preview](https://github.com/AliHamzaAzam/repomon/releases/tag/desktop-preview) is the moving desktop release used by preview-channel installs for updates. "Preview" names that rolling testing channel, not a requirement to assemble the app yourself. The standalone CLI uses the [latest versioned release](https://github.com/AliHamzaAzam/repomon/releases/latest). Check desktop updates in Settings > General > Check for updates.

            Updates are cryptographically signed. The current desktop downloads do not yet have an OS-level code signature, so macOS Gatekeeper or Windows SmartScreen may prompt on first install. Those are separate signing systems. On macOS, use the system's Open Anyway approval for the downloaded app; on Windows, use More info > Run anyway if SmartScreen prompts.

            ## First launch

            Open Repomon after the OS approval. The bundled daemon starts automatically. The first-run wizard checks Git, the agent runtime and installed agent CLIs, then helps you add a repository, choose an agent and configure notifications and optional Repomind. Add a lane and start your agent; its terminal appears in the workspace.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.signed.conf.json
