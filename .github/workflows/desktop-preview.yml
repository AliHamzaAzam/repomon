name: desktop preview

# Publish desktop tags to a fixed preview release so the updater retains a stable metadata endpoint.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-preview
  cancel-in-progress: false

jobs:
  # Gate publication on Windows smoke results; a draft flag cannot protect an already-public moving
  # release.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Prepare sidecars
        working-directory: apps/desktop
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
          CI: "true"
        run: bun run sidecar:prepare
      - name: Build Windows installer without publishing
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.preview.win.conf.json
      - name: Windows smoke test
        timeout-minutes: 5
        shell: pwsh
        run: .github/scripts/windows-smoke.ps1 -Triple "x86_64-pc-windows-msvc"

  # Rebuild the moving release to keep versionless artifacts and updater signatures matched.
  reset:
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Delete the stale desktop-preview release + tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete desktop-preview -R ${{ github.repository }} --cleanup-tag --yes || true

  preview:
    needs: [reset, windows-smoke]
    strategy:
      fail-fast: false
      # Serialize metadata updates because each platform read-modify-writes the same latest.json.
      max-parallel: 1
      matrix:
        include:
          # A universal macOS artifact avoids per-architecture updater-name collisions.
          - platform: macos-14
            target: universal-apple-darwin
            bundles: app,dmg
            config: src-tauri/tauri.preview.conf.json
            apple_universal: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            config: src-tauri/tauri.preview.conf.json
          # Windows uses the bundled ConPTY host instead of tmux.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            config: src-tauri/tauri.preview.win.conf.json
            host_sidecar: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Add Rust targets
        shell: bash
        run: |
          if [[ "${{ matrix.apple_universal }}" == "true" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          librsvg2-dev
          libayatana-appindicator3-dev
          patchelf
          rpm
          tmux
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      # Bundle the daemon and CLI so command-line installation needs no separate download.
      - name: Build daemon and CLI sidecars
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [[ "${{ matrix.apple_universal }}" == "true" ]]; then
            # Provide both architecture slices for compilation and the universal name for final
            # bundling.
            cargo build --release --locked -p repomon-daemon -p repomon-tui --target aarch64-apple-darwin
            cargo build --release --locked -p repomon-daemon -p repomon-tui --target x86_64-apple-darwin
            for bin in repomond repomon; do
              cp "target/aarch64-apple-darwin/release/$bin" "apps/desktop/src-tauri/binaries/$bin-aarch64-apple-darwin"
              cp "target/x86_64-apple-darwin/release/$bin" "apps/desktop/src-tauri/binaries/$bin-x86_64-apple-darwin"
              lipo -create -output "apps/desktop/src-tauri/binaries/$bin-universal-apple-darwin" \
                "target/aarch64-apple-darwin/release/$bin" \
                "target/x86_64-apple-darwin/release/$bin"
            done
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release --locked -p repomon-daemon -p repomon-tui --target "${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/repomond.exe" "apps/desktop/src-tauri/binaries/repomond-${{ matrix.target }}.exe"
            cp "target/${{ matrix.target }}/release/repomon.exe" "apps/desktop/src-tauri/binaries/repomon-${{ matrix.target }}.exe"
          else
            cargo build --release --locked -p repomon-daemon -p repomon-tui --target "${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/repomond" "apps/desktop/src-tauri/binaries/repomond-${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/repomon" "apps/desktop/src-tauri/binaries/repomon-${{ matrix.target }}"
          fi
      - name: Build agent-host sidecar (Windows)
        if: ${{ matrix.host_sidecar }}
        shell: bash
        run: |
          cargo build --release --locked -p repomon-host --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/repomon-agent-host.exe" "apps/desktop/src-tauri/binaries/repomon-agent-host-${{ matrix.target }}.exe"
      # Prepare declared tmux artifacts before bundling; the shared script builds macOS sources,
      # downloads Linux binaries, and skips Windows.
      - name: Install macOS build tools for bundled tmux
        if: matrix.apple_universal
        run: brew install autoconf automake pkg-config
      - name: Prepare tmux sidecar
        working-directory: apps/desktop
        shell: bash
        env:
          CI: "true"
        run: |
          if [[ "${{ matrix.apple_universal }}" == "true" ]]; then
            TAURI_ENV_TARGET_TRIPLE=aarch64-apple-darwin bun run sidecar:prepare
            TAURI_ENV_TARGET_TRIPLE=x86_64-apple-darwin bun run sidecar:prepare
            # Final bundling resolves the universal-suffixed artifact directly.
            lipo -create -output src-tauri/binaries/tmux-universal-apple-darwin \
              src-tauri/binaries/tmux-aarch64-apple-darwin \
              src-tauri/binaries/tmux-x86_64-apple-darwin
            chmod +x src-tauri/binaries/tmux-universal-apple-darwin
          else
            TAURI_ENV_TARGET_TRIPLE=${{ matrix.target }} bun run sidecar:prepare
          fi
      # Enable updater artifacts so macOS and Linux produce signatures and appear in latest.json.
      - name: Enable updater artifacts for this platform's config
        if: runner.os != 'Windows'
        working-directory: apps/desktop
        run: |
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.preview.conf.json > src-tauri/tauri.preview.conf.json.tmp
          mv src-tauri/tauri.preview.conf.json.tmp src-tauri/tauri.preview.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop

          tagName: desktop-preview
          releaseName: Repomon Desktop (preview)
          releaseBody: |
            Rolling preview build of the Repomon desktop app, for testing. The installed app
            auto-updates from this release (updates are cryptographically signed; the OS-level
            code signature is not set yet, so first install shows a Gatekeeper/SmartScreen prompt).

            Requires a working `repomon`/`repomond` setup (tmux on macOS/Linux).

            - macOS: universal dmg. Right-click the app and choose Open on first launch
              (or `xattr -dr com.apple.quarantine /Applications/Repomon.app`).
            - Linux: AppImage (auto-updates), deb, or rpm. Requires `tmux`.
            - Windows: NSIS installer. Bundles the daemon and per-agent ConPTY host (no tmux needed).
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ${{ matrix.config }}

  cleanup:
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale preview assets and verify updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          gh release view desktop-preview --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              latest.json|Repomon_universal.app.tar.gz|Repomon_universal.app.tar.gz.sig|*"$version"*) ;;
              *) gh release delete-asset desktop-preview "$asset" -y ;;
            esac
          done
          asset_id="$(gh api repos/${{ github.repository }}/releases/tags/desktop-preview --jq '.assets[] | select(.name == "latest.json") | .id')"
          gh api "repos/${{ github.repository }}/releases/assets/$asset_id" -H "Accept: application/octet-stream" > latest.json
          jq -e --arg version "$version" '
            .version == $version
            and (.platforms["darwin-aarch64"].signature | length > 0)
            and (.platforms["linux-x86_64"].signature | length > 0)
            and (.platforms["windows-x86_64"].signature | length > 0)
          ' latest.json
