[package]
name = "repomon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Core library for repomon: data model, git layer, store, watchers, agent runtime."

[features]
default = []
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
gix = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
globset = { workspace = true }
ts-rs = { workspace = true, optional = true }
candle-core = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }

# Share host protocol types and per-user pipe security; CancelSynchronousIo stops blocking Windows
# stream readers.
[target.'cfg(windows)'.dependencies]
repomon-host = { path = "../repomon-host" }
base64 = { workspace = true }
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = { workspace = true }
